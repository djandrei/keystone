[project]
name = "keystone-api"
version = "0.1.0"
description = "Keystone API — multi-user AI-assisted RE/VR platform"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-json-logger>=2.0",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "argon2-cffi>=23.1",
    "PyJWT>=2.8",
    # --- engine + async (M2) ---
    "dspy>=2.5",
    "celery>=5.3",
    "redis>=5.0",
    "boto3>=1.34",
    "flask-sock>=0.7",
]

[project.optional-dependencies]
# Added incrementally as milestones need them (DB, auth, jobs, storage).
prod = [
    "gunicorn>=21.2",
    "gevent>=23.9",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.0",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["keystone_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: needs the live Docker Compose services (db/redis/minio/ghidra-mcp)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "B904", "B007", "E731", "UP042", "UP047"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false

[tool.coverage.run]
source = ["keystone_api", "keystone_engine"]
omit = ["tests/*", "migrations/*"]

[tool.coverage.report]
skip_empty = true
