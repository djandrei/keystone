# Production stack — built images, gunicorn, nginx+TLS, persistent volumes.
# Standalone (not an overlay). Bring up:
#   ./infra/gen-certs.sh            # once, for a self-signed cert (or drop real certs in infra/certs)
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env up -d --build
name: keystone-prod

x-backend-env: &backend-env
  env_file: [.env]
  environment:
    KEYSTONE_ENV: production

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-keystone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong password}
      POSTGRES_DB: ${POSTGRES_DB:-keystone}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keystone}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 10 }
    restart: unless-stopped

  # S3 object store: VersityGW over a plain directory -- each object is a file
  # under /data/<bucket>/. Its root credentials are the app's S3 keys.
  s3:
    image: versity/versitygw:v1.8.0
    command: ["--quiet", "posix", "/data"]
    environment:
      ROOT_ACCESS_KEY: ${KEYSTONE_S3_ACCESS_KEY:-keystone}
      ROOT_SECRET_KEY: ${KEYSTONE_S3_SECRET_KEY:?set a strong S3 secret}
    volumes: [s3data:/data]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "7070"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Creates the bucket (idempotent), then exits; the backend waits for it.
  s3-init:
    build: { context: ../backend, target: prod }
    <<: *backend-env
    depends_on: { s3: { condition: service_healthy } }
    command: ["python", "-m", "keystone_api.cli", "init-storage"]
    restart: "no"

  # backup.sh / restore.sh only (`compose run`); never started by `up`.
  aws:
    image: amazon/aws-cli:2.37.9
    profiles: ["tools"]
    environment:
      AWS_ACCESS_KEY_ID: ${KEYSTONE_S3_ACCESS_KEY:-keystone}
      AWS_SECRET_ACCESS_KEY: ${KEYSTONE_S3_SECRET_KEY:?set a strong S3 secret}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://s3:7070

  backend:
    build: { context: ../backend, target: prod }
    <<: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }
    # ghidra-headless-mcp's samples directory, shared with it (see worker).
    volumes: ["${KEYSTONE_SAMPLES_DIR:-../../ghidra-headless-mcp/samples}:/samples"]
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readyz', timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 25s
    restart: unless-stopped

  worker:
    build: { context: ../backend, target: worker-prod }
    <<: *backend-env
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    # Calls a running ghidra-headless-mcp (its own repository and compose) on
    # that stack's network as http://ghidra-headless-mcp:1341, and shares its
    # samples directory at /samples. Start it first.
    volumes: ["${KEYSTONE_SAMPLES_DIR:-../../ghidra-headless-mcp/samples}:/samples"]
    networks: [default, ghidra]
    command: ["celery", "-A", "worker.app", "worker", "--loglevel=info", "--concurrency=4"]
    restart: unless-stopped

  frontend:
    build: { context: ../frontend, target: prod }
    depends_on: [backend]
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped

volumes:
  pgdata:
  s3data:

networks:
  default:
  # ghidra-headless-mcp's compose network (it names it; start that stack first).
  ghidra:
    external: true
    name: ${KEYSTONE_GHMCP_NETWORK:-ghidra-headless-mcp}
