# Production stack — built images, gunicorn, nginx+TLS, persistent volumes.
# Standalone (not an overlay). Bring up:
#   ./infra/gen-certs.sh            # once, for a self-signed cert (or drop real certs in infra/certs)
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env up -d --build
name: keystone-prod

x-backend-env: &backend-env
  env_file: [.env]
  environment:
    KEYSTONE_ENV: production

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-keystone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong password}
      POSTGRES_DB: ${POSTGRES_DB:-keystone}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keystone}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 10 }
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-keystone}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set a strong password}
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: >
      /bin/sh -c "mc alias set k http://minio:9000 $${MINIO_ROOT_USER:-keystone} $${MINIO_ROOT_PASSWORD} &&
                  mc mb -p k/$${KEYSTONE_S3_BUCKET:-keystone} || true"
    env_file: [.env]

  backend:
    build: { context: ../backend, target: prod }
    <<: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    volumes: [samples:/samples]
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readyz', timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 25s
    restart: unless-stopped

  worker:
    build: { context: ../backend, target: worker-prod }
    <<: *backend-env
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    volumes: [samples:/samples]
    command: ["celery", "-A", "worker.app", "worker", "--loglevel=info", "--concurrency=4"]
    restart: unless-stopped

  frontend:
    build: { context: ../frontend, target: prod }
    depends_on: [backend]
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  samples:
