# Overlay for the M2 e2e: run the worker with the deterministic fake engine so the
# full async path (upload -> queue -> worker -> progress -> report) is provable
# without Ghidra or an LLM. Bring up with:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.e2e.yml \
#     --profile engine up -d worker
name: keystone
services:
  worker:
    environment:
      KEYSTONE_ENGINE_FAKE: "1"
