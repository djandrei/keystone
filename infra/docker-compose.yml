name: keystone

x-backend-env: &backend-env
  env_file: [.env]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-keystone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keystone}
      POSTGRES_DB: ${POSTGRES_DB:-keystone}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keystone}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3 object store: VersityGW over a plain directory -- each object is a file
  # under /data/<bucket>/. Its root credentials are the app's S3 keys.
  s3:
    image: versity/versitygw:v1.8.0
    command: ["--quiet", "posix", "/data"]
    environment:
      ROOT_ACCESS_KEY: ${KEYSTONE_S3_ACCESS_KEY:-keystone}
      ROOT_SECRET_KEY: ${KEYSTONE_S3_SECRET_KEY:-keystone-dev-secret}
    volumes: [s3data:/data]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "7070"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the bucket (idempotent), then exits; the backend waits for it.
  s3-init:
    build:
      context: ../backend
      target: base
    <<: *backend-env
    depends_on:
      s3: { condition: service_healthy }
    command: ["python", "-m", "keystone_api.cli", "init-storage"]
    restart: "no"

  backend:
    build:
      context: ../backend
      target: base
    <<: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }
    volumes: ["../backend:/app"]
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readyz', timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ../frontend
      target: base
    volumes: ["../frontend:/app", "/app/node_modules"]
    expose: ["5173"]

  nginx:
    image: nginx:alpine
    depends_on: [backend, frontend]
    volumes: ["./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["8080:80"]

  # --- engine profile (M2): the analysis worker ---
  # Ghidra itself is not part of this stack: the worker calls a running
  # ghidra-headless-mcp (its own repository and compose) at KEYSTONE_MCP_ENDPOINT,
  # its published --http /api on the Docker host, and sends each binary there as
  # raw bytes. The two stacks share no files and no network. Start it first.
  worker:
    build:
      context: ../backend
      target: worker
    profiles: ["engine"]
    <<: *backend-env
    depends_on:
      redis: { condition: service_healthy }
    volumes: ["../backend:/app"]
    # host.docker.internal is not defined on Linux unless mapped like this.
    extra_hosts: ["host.docker.internal:host-gateway"]
    command: ["celery", "-A", "worker.app", "worker", "--loglevel=info", "--concurrency=4"]

volumes:
  pgdata:
  s3data:
