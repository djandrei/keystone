name: keystone

x-backend-env: &backend-env
  env_file: [.env]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-keystone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keystone}
      POSTGRES_DB: ${POSTGRES_DB:-keystone}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keystone}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-keystone}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-keystone-dev-secret}
    ports: ["9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set ks http://minio:9000 ${MINIO_ROOT_USER:-keystone} ${MINIO_ROOT_PASSWORD:-keystone-dev-secret} &&
      mc mb -p ks/${KEYSTONE_S3_BUCKET:-keystone} &&
      echo 'bucket ready';"
    restart: "no"

  backend:
    build:
      context: ../backend
      target: base
    <<: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    # /samples is ghidra-headless-mcp's samples directory, shared with it so the
    # path the worker hands to analyze_binary is the same file on both sides.
    volumes: ["../backend:/app", "${KEYSTONE_SAMPLES_DIR:-../../ghidra-headless-mcp/samples}:/samples"]
    networks: [default, llm]
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readyz', timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ../frontend
      target: base
    volumes: ["../frontend:/app", "/app/node_modules"]
    expose: ["5173"]

  nginx:
    image: nginx:alpine
    depends_on: [backend, frontend]
    volumes: ["./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["8080:80"]

  # --- engine profile (M2): the analysis worker ---
  # Ghidra itself is not part of this stack: the worker calls a running
  # ghidra-headless-mcp (its own repository and compose) over that stack's
  # network, as http://ghidra-headless-mcp:1341. Start it first.
  worker:
    build:
      context: ../backend
      target: worker
    profiles: ["engine"]
    <<: *backend-env
    depends_on:
      redis: { condition: service_healthy }
    volumes: ["../backend:/app", "${KEYSTONE_SAMPLES_DIR:-../../ghidra-headless-mcp/samples}:/samples"]
    networks: [default, llm, ghidra]
    command: ["celery", "-A", "worker.app", "worker", "--loglevel=info", "--concurrency=4"]

volumes:
  pgdata:
  miniodata:

networks:
  default:
  llm:
    external: true
    name: keystone-llm
  # ghidra-headless-mcp's compose network (it names it; start that stack first).
  ghidra:
    external: true
    name: ${KEYSTONE_GHMCP_NETWORK:-ghidra-headless-mcp}
