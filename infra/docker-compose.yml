name: keystone

x-backend-env: &backend-env
  env_file: [.env]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-keystone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keystone}
      POSTGRES_DB: ${POSTGRES_DB:-keystone}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keystone}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-keystone}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-keystone-dev-secret}
    ports: ["9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set ks http://minio:9000 ${MINIO_ROOT_USER:-keystone} ${MINIO_ROOT_PASSWORD:-keystone-dev-secret} &&
      mc mb -p ks/${KEYSTONE_S3_BUCKET:-keystone} &&
      echo 'bucket ready';"
    restart: "no"

  backend:
    build: ../backend
    <<: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    volumes: ["../backend:/app", "samples:/samples"]
    expose: ["8000"]

  frontend:
    build: ../frontend
    volumes: ["../frontend:/app", "/app/node_modules"]
    expose: ["5173"]

  nginx:
    image: nginx:alpine
    depends_on: [backend, frontend]
    volumes: ["./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["8080:80"]

  # --- engine profile (M2): heavy / not needed for the M1 backbone ---
  ghidra-mcp:
    image: ghidra-headless-mcp:local
    profiles: ["engine"]
    environment:
      GHIDRA_INSTALL_DIR: /ghidra
    expose: ["1341"]
    volumes: [ghidra-projects:/projects, "samples:/samples"]

  worker:
    build: ../backend
    profiles: ["engine"]
    <<: *backend-env
    depends_on:
      redis: { condition: service_healthy }
    volumes: ["../backend:/app", "samples:/samples"]
    command: ["celery", "-A", "worker.app", "worker", "--loglevel=info"]

volumes:
  pgdata:
  miniodata:
  ghidra-projects:
  samples:
