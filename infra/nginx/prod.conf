# Production edge: TLS termination, static SPA, /api reverse proxy (+ WebSocket).
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;   # force TLS
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    client_max_body_size 512m;              # binary uploads

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # security headers (the app sets its own too)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # API -> gunicorn (strip /api), with WebSocket upgrade for analysis progress
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # built SPA with client-side routing fallback
    root /usr/share/nginx/html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
