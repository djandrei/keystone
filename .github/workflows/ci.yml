name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Lint (ruff + black)
        working-directory: backend
        run: ruff check . && black --check .
      - name: Test (coverage-gated)
        working-directory: backend
        run: pytest --cov=keystone_api --cov=keystone_engine --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: frontend
        run: npm ci || npm install
      - name: Typecheck / lint / test / build
        working-directory: frontend
        run: npm run typecheck && npm run lint && npm test && npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bring up the stack (fake engine) and run Playwright
        run: |
          # The stack's external pieces: the LLM network, and ghidra-headless-mcp's
          # network and samples directory. The fake engine never calls Ghidra, so
          # an empty network and directory are enough here.
          docker network create keystone-llm
          docker network create ghidra-headless-mcp
          mkdir -p ../ghidra-headless-mcp/samples
          docker compose -f infra/docker-compose.yml up -d --build
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.e2e.yml --profile engine up -d worker
          npx --yes playwright@1.62.1 test --config frontend/playwright.config.ts
