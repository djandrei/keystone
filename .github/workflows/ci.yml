name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Lint (ruff + black)
        working-directory: backend
        run: ruff check . && black --check .
      - name: Test (coverage-gated)
        working-directory: backend
        run: pytest --cov=keystone_api --cov=keystone_engine --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        working-directory: frontend
        run: npm ci || npm install
      - name: Typecheck / lint / test / build
        working-directory: frontend
        run: npm run typecheck && npm run lint && npm test && npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # run-dev.sh is the dev bring-up: it creates infra/.env from the example
      # (gitignored, so absent here), builds and starts the stack, waits for the
      # backend, applies migrations, bootstraps the admin, and starts the worker
      # on the fake engine.
      - name: Bring up the stack (fake engine)
        run: ./run-dev.sh
      # The Playwright image carries browsers for the locked @playwright/test
      # (1.62.1), and npm ci gives the config the package it imports.
      - name: Run Playwright
        run: |
          docker run --rm --network host -v "$PWD/frontend":/work -w /work \
            -e CI=1 -e HOME=/tmp mcr.microsoft.com/playwright:v1.62.1-noble \
            sh -c "npm ci --no-audit --no-fund && npx playwright test"
